[package]
name = "timetracker-mcp"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4"
dotenvy = "0.15"
rmcp = { version = "3.2", features = ["server", "macros", "transport-io", "schemars"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
