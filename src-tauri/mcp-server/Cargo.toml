[package]
name = "timetracker-mcp"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4"
rmcp = { version = "3.2", features = ["server", "macros", "transport-io", "schemars"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time-tracker-core = { path = "../core" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
